    <main class="page">

        <h1>Contact Me</h1>


        <section class="contact-container">


            <!-- Contact Information -->

            <div class="contact-info">

                <h2>Get In Touch</h2>

                <p>
                    Feel free to contact me for any
                    professional or academic enquiries.
                </p>

                <div class="contact-item">
                    📧
                    <strong>Email:</strong>
                   junaidlohari09@gmail.com
                </div>

                <div class="contact-item">
                    📱
                    <strong>Phone:</strong>
                    +91 98765 43210
                </div>

                <div class="contact-item">
                    📍
                    <strong>Location:</strong>
                    Bengaluru, Karnataka
                </div>

            </div>


            <!-- Contact Form -->

            <form id="contactForm">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Subject</label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter subject"
                    required
                >


                <label>Message</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Enter your message"
                    required
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>
